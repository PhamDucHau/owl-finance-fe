
<h2 mat-dialog-title class="mat-subtitle-1">Xác nhận</h2>
<div mat-dialog-content class="mat-subtitle-2 lh-16">
  Bạn có chắc chắn muốn thực hiện hành động trên ?
</div>
<div mat-dialog-actions class="p-24 p-t-0">
  <button mat-stroked-button color="warn" (click)="cancle()"  mat-dialog-close>No</button>
  <button mat-flat-button color="primary" (click)="save()"  cdkFocusInitial>Ok</button>
</div>
