 <mat-card class="cardWithShadow rounded-8 elevation-1" style="margin-bottom: 0px">
  <mat-card-content class="text-center p-8" style="cursor: pointer; position: relative">
      
      <div class="card-title" style="margin-top:20px; margin-bottom: 20px ;">Add Transaction</div>

    
      <form [formGroup]="transactionsForm" (ngSubmit)="onSubmit()" >      
  
        <div class="d-flex align-items-center justify-content-between gap-16 p-l-16 p-r-16">
          <mat-label class="mat-subtitle-2 f-w-600 d-block m-b-24 text-left" style="line-height: 1.5"
              >Category:
          </mat-label>
          <mat-form-field appearance="outline" class="w-100" style="width: 20rem" >
            <input  matInput placeholder="Category" formControlName="category"/>
            <!-- <div *ngIf="cardsForm.controls['card_number'].invalid && cardsForm.controls['card_number'].touched">
              Card number must be at least 4 characters.
            </div> -->
          </mat-form-field>
        </div>
  
        <div class="d-flex align-items-center justify-content-between gap-16 p-l-16 p-r-16">
          <mat-label class="mat-subtitle-2 f-w-600 d-block m-b-24 text-left" style="line-height: 1.5"
              >Product:
          </mat-label>
          <mat-form-field appearance="outline" class="w-100" style="width: 20rem" >
            <input matInput placeholder="Product" formControlName="product"/>
            <!-- <div *ngIf="cardsForm.controls['due_date'].invalid && cardsForm.controls['due_date'].touched">
              Must be between 1 and 12.
            </div> -->
          </mat-form-field>
        </div>

        <div class="d-flex align-items-center justify-content-between gap-16 p-l-16 p-r-16">
          <mat-label class="mat-subtitle-2 f-w-600 d-block m-b-24 text-left" style="line-height: 1.5"
              >Quantity:
          </mat-label>
          <mat-form-field appearance="outline" class="w-100" style="width: 20rem" >
            <input matInput placeholder="Quantity" formControlName="quantity"/>
            
          </mat-form-field>
        </div>
  
        <div class="d-flex align-items-center justify-content-between gap-16 p-l-16 p-r-16">
          <mat-label class="mat-subtitle-2 f-w-600 d-block m-b-24 text-left" style="line-height: 1.5"
              >Money:
          </mat-label>
          <mat-form-field appearance="outline" class="w-100" style="width: 20rem" >
            <input matInput placeholder="Money" formControlName="money"/>
            
          </mat-form-field>
        </div>
  
      
  
      
      </form>  

      
          
      <div class="d-flex align-items-center justify-content-end gap-4">
        <div mat-dialog-actions class=" p-t-0 d-flex justify-content-end">
          <!-- <button mat-stroked-button color="warn" (click)="cancle()" mat-dialog-close>No</button> -->
          <button mat-flat-button color="primary" (click)="cancle()" cdkFocusInitial>Huỷ</button>
        </div>
       
        <div mat-dialog-actions class=" p-t-0 d-flex justify-content-end">
          <!-- <button mat-stroked-button color="warn" (click)="cancle()" mat-dialog-close>No</button> -->
          <button mat-flat-button color="primary" (click)="save()" cdkFocusInitial>Hoàn thành</button>
        </div>
      </div>
  </mat-card-content>
</mat-card>
