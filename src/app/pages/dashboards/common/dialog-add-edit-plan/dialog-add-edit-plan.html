<h2 class="f-w-500 m-b-24" mat-dialog-title><strong>ADD NEW PLAN</strong></h2>


<mat-dialog-content style="max-width: 600px">
  <form [formGroup]="planForm">
    
    <mat-tab-group mat-stretch-tabs="false" mat-align-tabs="start">
        <mat-tab label="Image Upload">
          <div class="bg-light-primary mat-body-1 p-16 rounded m-t-12">
            <div class="d-flex align-items-center m-b-8">      
                <button mat-flat-button color="primary" class="input-file-button">
                  <input type="file" (change)="selectFile($event)" #fileInput />        
                </button>
              </div>
          </div>
        </mat-tab>
        <mat-tab label="Link">
          <div class="bg-light-primary mat-body-1 p-16 rounded m-t-12">
            <mat-form-field appearance="outline" class="w-100">
                <input
                  type="text"
                  matInput
                  required
                  id="image"
                  name="image"            
                  placeholder="image"
                  formControlName="image"                  
                />
              </mat-form-field>
          </div></mat-tab
        >
       
    </mat-tab-group>
    <div class="row">
      <div class="col-lg-12">
        <img
        class="mat-card-avatar m-b-8"
        [src]="imagePreview"
        width="100%"
        style="border-radius: 10px; max-height: 200px; object-fit: cover; object-position: center; "
        
      />
      </div>
      <div class="col-lg-6">
        <mat-form-field appearance="outline" class="w-100">
          <input
            type="text"
            matInput
            required
            id="name"
            name="name"            
            placeholder="Name Plan"
            formControlName="name"
          />
        </mat-form-field>
      </div>
      <div class="col-lg-6">
        <mat-form-field appearance="outline" class="w-100">
          <input
            type="text"
            matInput
            required
            id="price"
            name="price"
            formControlName="price"
            placeholder="Price"
          />
        </mat-form-field>
      </div>

      <div class="col-lg-6">
        <mat-form-field appearance="outline" class="w-100">
            <input
              matInput
              [matDatepicker]="startDateDP"
              placeholder="Start Date"
              name="startDate"             
              formControlName="date_start"
            />
            <mat-datepicker-toggle
              matSuffix
              [for]="startDateDP"
            ></mat-datepicker-toggle>
            <mat-datepicker #startDateDP></mat-datepicker>
          </mat-form-field>
      </div>
      <div class="col-lg-6">
        <mat-form-field appearance="outline" class="w-100">
            <input
              matInput              
              [matDatepicker]="endDateDP"
              placeholder="End Date"
              name="endDate"
              formControlName="date_end"
              
            />
            <mat-datepicker-toggle
              matSuffix
              [for]="endDateDP"
            ></mat-datepicker-toggle>
            <mat-datepicker #endDateDP></mat-datepicker>
          </mat-form-field>
      </div>
    </div>
    <button
      mat-flat-button
      (click)="save()"
      mat-flat-button
      color="primary"
      [disabled]="!planForm.valid"
    >
      Save
    </button>
    <button
      mat-stroked-button
      color="warn"
      class="m-l-8"
      (click)="closeDialog()"
    >
      Cancel
    </button>
  </form>
</mat-dialog-content>
